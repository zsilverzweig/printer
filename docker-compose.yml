version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: printer-db
    environment:
      POSTGRES_DB: printer_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - printer-network

  # FastAPI Server
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: printer-server
    ports:
      - "8000:8000"
    volumes:
      - ./apps/server:/app
      - ./apps/server/env.local:/app/env.local:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/printer_events
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - printer-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: printer-web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules # Use container's node_modules (anonymous volume)
      - ./apps/web/.next:/app/apps/web/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - NX_DAEMON=false
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - API_URL=http://server:8000
    depends_on:
      - server
    networks:
      - printer-network
    command: sh -c "cd /app/apps/web && npx next dev --hostname 0.0.0.0"

volumes:
  postgres_data:
    name: printer-postgres-data

networks:
  printer-network:
    name: printer-network
    driver: bridge
