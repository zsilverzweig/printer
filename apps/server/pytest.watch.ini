# pytest-watch configuration
# Run with: ptw -- -x --tb=short
#
# This config ensures test runs are cancelled when new file changes are detected

[pytest-watch]
# Don't run tests on every file change, only Python files
ignore = htmlcov/,*.md,*.json,*.txt,.git/,__pycache__/,*.pyc,.testmondata

# Run tests when these patterns change
watch = app/,tests/

# Pass these arguments to pytest
runner = pytest
runner_args = --testmon --exitfirst --tb=short -v --maxfail=1

# Clear screen before each run
clear = True

# Don't beep on failures (annoying)
beep = False

# Wait for changes to settle before running (debounce)
# Lower = faster response, but more runs if you save multiple files quickly
delay = 0.3

# Cancel previous run when new file change detected
# This is the default behavior, but we ensure it works
cancel_on_change = True

